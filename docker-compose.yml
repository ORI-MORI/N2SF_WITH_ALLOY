services:
  backend:
    build: ./BACKEND
    ports:
      - "3001:3001"
    volumes:
      - ./BACKEND:/app
      - /app/node_modules
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173

  frontend-react:
    build:
      context: ./FRONTEND_REACT
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
